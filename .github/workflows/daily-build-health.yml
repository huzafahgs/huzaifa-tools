name: Huzaifa Tools Daily Build Health Check

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huzaifa-tools-daily-build
  cancel-in-progress: true

jobs:
  production-build-check:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies, including Vite and other devDependencies
        run: npm ci --include=dev

      - name: Run production build (prebuild, build, and postbuild)
        run: npm run build
