name: Huzaifa Tools Build Diagnostic

on:
  push:
    branches:
      - diagnostics/github-build-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huzaifa-tools-build-diagnostic
  cancel-in-progress: true

jobs:
  production-build-check:
    name: Install dependencies and run production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies, including devDependencies
        run: npm ci --include=dev

      - name: Run the exact production build script
        run: npm run build
